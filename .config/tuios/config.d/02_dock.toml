[appearance]
dock_workspace_tab_format = '{icon} {name}'
dockbar_position = 'top'
dock_prefix_indicator = "pill"
dock_pill_caps = true
dock_workspace_label_max = 12
dock_workspace_tooltip = true
dock_mode_split_letter = true
dock_compact = true

[dock]
center = []
left = ['mode', 'workspaces']
right = [ 'session-controls']

# [dock.clock]
# format = '15:04'

[dock.tabs]
number_glyphs = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十']

