# agents thingies
[keybindings.prefix_mode]
prefix_inbox = ['i']
prefix_mail = ['M']

[keybindings.inbox]
inbox_close = ['esc', 'q']
inbox_deny_reason = ['n']
inbox_detail_down = ['J', 'ctrl+d']
inbox_detail_up  = ['K', 'ctrl+u']
inbox_dismiss = ['d', 'delete']
inbox_filter = ['f']
inbox_first = ['g', 'home']
inbox_last = ['G', 'end']
inbox_peek = ['space']
inbox_reply = ['r']
inbox_resume = ['y']
inbox_review = ['v']
inbox_select = ['/']
inbox_show_snoozed = ['S']
inbox_snooze = ['z']
inbox_undo = ['u']

[keybindings.inbox_peek]
peek_approve = ['a']
peek_approve_always = ['A']
peek_deny = ['d']
peek_go = ['enter']
peek_read_again = ['r']
peek_type = ['tab']

[keybindings.mail]
mail_focus_pane = ['o']
mail_new = ['n']
mail_reply = ['r']

